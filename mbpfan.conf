[general]
# mbpfan will load the max / min speed of from the files produced by the applesmc driver. If these files are not found it will set all fans to the default of min_speed = 2000 and max_speed = 6200
# by setting the values for the speeds in this config it will override whatever it finds in:
# kernel < 7.3:
#   /sys/devices/platform/applesmc.768/fan*_min
#   /sys/devices/platform/applesmc.768/fan*_max
# kernel >= 7.3:
#   /sys/devices/platform/applesmc.768/hwmon/hwmon*/fan*_min
#   /sys/devices/platform/applesmc.768/hwmon/hwmon*/fan*_max
# or the defaults.
#
# multiple fans can be configured by using the config key of min_fan*_speed and max_fan*_speed
# the number used will correlate to the file number of the fan in the applesmc driver that are used to control the fan speed.
#
#min_fan1_speed = 2000	# put the *lowest* value of fan*_min (see the paths above)
#max_fan1_speed = 6200	# put the *highest* value of fan*_max (see the paths above)

polling_interval = 1	# seconds between polls

# Max rpm change per second in each direction (asymmetric slew) - the fan
# ramps toward a new target instead of snapping to it, and drops back down
# faster than it climbs.
up_rate = 350
down_rate = 600

# EMA weight of a new temperature reading, % (0-100). ~10 gives a ~10s time
# constant, so short load bursts barely spin the fan up.
temp_alpha_percent = 10

# Emergency: after hard_max_hold consecutive readings at/above
# hard_max_temp (the raw reading, not the EMA-smoothed one), the fan jumps
# straight to max speed, bypassing smoothing and slew entirely.
hard_max_temp = 103
hard_max_hold = 3

# Multi-point curve: "temp_c:percent" pairs (percent of the fan_min..
# fan_max range), comma-separated, linearly interpolated and clamped at
# the ends. Must be sorted by strictly increasing temp_c, and the first
# point is the idle floor. 0% is the fan's hardware minimum (fan*_min),
# not a stopped fan.
#
# Tip: find a fan speed that you can't hear, or can only just hear, and
# use it as the first point (raise the next points if they are lower).
# The Mac then stays a bit cooler at idle, so short loads don't make the
# fan speed up. To turn rpm into percent:
# (rpm - fan_min) * 100 / (fan_max - fan_min).
curve = 65:0,75:15,82:35,88:65,95:100
